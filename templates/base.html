<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}A modern Flask starter with beautiful, responsive UI.{% endblock %}" />
  <title>{% block title %}{{ app_name }}{% endblock %} — {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>" />
</head>
<body>
  {% import "partials/_macros.html" as partials %}
  {{ partials.nav(active_nav|default('home')) }}

  <main>
    {% block content %}{% endblock %}
  </main>

  {{ partials.footer() }}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
